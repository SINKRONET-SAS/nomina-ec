name: Nomina-Ec CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nomina_ec_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nomina_ec_ci?schema=public
      DB_SSL: "false"
      JWT_SECRET: ci-secret
      BANK_ACCOUNT_ENCRYPTION_KEY: ci-bank-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install backend dependencies (resilient)
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_factor: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "30000"
          npm_config_prefer_online: "true"
          npm_config_cache: ${{ runner.temp }}/npm-cache-backend
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefix backend; then
              echo "npm ci backend succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "npm ci backend failed after ${attempt} attempts"
              exit 1
            fi
            echo "npm ci backend failed on attempt ${attempt}; clearing npm cache before retry"
            npm cache clean --force --cache "${RUNNER_TEMP}/npm-cache-backend"
            sleep $((attempt * 2))
          done
      - run: npm --prefix backend run prisma:validate
      - run: npm --prefix backend run db:migrate
      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install frontend dependencies (resilient)
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_factor: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "30000"
          npm_config_prefer_online: "true"
          npm_config_cache: ${{ runner.temp }}/npm-cache-frontend
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefix frontend-web; then
              echo "npm ci frontend succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "npm ci frontend failed after ${attempt} attempts"
              exit 1
            fi
            echo "npm ci frontend failed on attempt ${attempt}; clearing npm cache before retry"
            npm cache clean --force --cache "${RUNNER_TEMP}/npm-cache-frontend"
            sleep $((attempt * 2))
          done
      - run: npm --prefix frontend-web run build
